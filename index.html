<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu PWA Instalável</title>
  
  <!-- Vinculação do Manifesto -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- Configurações para iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meu PWA">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="theme-color" content="#6200ee">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 50px auto;
    }
    button {
      background-color: #6200ee;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      display: none; /* Aparece apenas se puder instalar */
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Meu PWA Funciona!</h1>
    <p>Se você cumpre todos os requisitos, o ícone de instalação aparecerá na barra do navegador.</p>
    <button id="btnInstalar">Instalar Aplicativo</button>
  </div>

  <script>
    // 1. Registro do Service Worker obrigatório
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker ativo no escopo:', reg.scope))
          .catch(err => console.error('Erro no Service Worker:', err));
      });
    }

    // 2. Lógica para capturar o evento de instalação (opcional, melhora a experiência)
    let deplayPrompt;
    const btnInstalar = document.getElementById('btnInstalar');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deplayPrompt = e;
      btnInstalar.style.display = 'inline-block'; // Mostra o botão customizado
    });

    btnInstalar.addEventListener('click', () => {
      if (deplayPrompt) {
        deplayPrompt.prompt();
        deplayPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Usuário aceitou a instalação');
          }
          btnInstalar.style.display = 'none';
          deplayPrompt = null;
        });
      }
    });
  </script>
</body>
</html>
